# Publication automatique des contenus « validé client » de Da Laura (@dalaura.cannes) sur Instagram.
# - Toutes les heures (à la minute 17), et à la demande depuis l'onglet Actions.
# - MODE TEST PAR DÉFAUT : rien n'est publié tant que la variable DRY_RUN n'est pas réglée sur « false ».
# - Le jeton est lu dans le Secret GitHub INSTAGRAM_TOKEN, jamais dans le code.
# Les exécutions programmées ne tournent que depuis la branche par défaut du dépôt (main).
name: Publication Instagram Da Laura

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Mode test (rien n'est publié)"
        type: choice
        options: ["true", "false"]
        default: "true"

permissions:
  contents: write

concurrency:
  group: publication-instagram
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les outils (Pillow, ffmpeg)
        run: |
          pip install --quiet pillow
          command -v ffprobe || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Publier les contenus validés dont l'heure est passée
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          # À la main : le choix du formulaire. Toutes les heures : la variable DRY_RUN du dépôt. Sinon : test.
          DRY_RUN: ${{ github.event.inputs.dry_run || vars.DRY_RUN || 'true' }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
        run: python outils/publier_instagram.py

      - name: Enregistrer les statuts « publié »
        if: always()
        run: |
          git config user.name "publication-automatique"
          git config user.email "actions@users.noreply.github.com"
          git add calendriers/
          if git diff --cached --quiet; then
            echo "Aucun statut modifié."
          else
            git commit -m "Statuts mis à jour après publication Instagram"
            git push
          fi
